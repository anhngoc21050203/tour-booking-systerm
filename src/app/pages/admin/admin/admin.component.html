<div class="admin-page">
  <h1>Trang quản trị</h1>
  <div class="admin-content">
    <div class="card-container">
      @for (module of adminModules; track module.title) {
      <mat-card class="module-card">
        <mat-card-header>
          <mat-icon mat-card-avatar>{{module.icon}}</mat-icon>
          <mat-card-title>{{module.title}}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{module.content}}</p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button color="accent">QUẢN LÝ</button>
        </mat-card-actions>
      </mat-card>
      }
    </div>
  </div>
</div>
